description = "A pixel-art anime girl desktop pet for Hyprland/Wayland that roams and reacts to screen activity"

[dependencies]
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
rand = "0.8"
